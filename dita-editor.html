<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1222"><title>Dita · Editor manual</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#142238;--line:#344b69;--text:#f5f8ff;--muted:#aab8cc;--blue:#1685e5;--pink:#ff5875}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#203b60,transparent 45%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{width:min(1180px,calc(100% - 24px));margin:auto;padding:20px 0 50px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:clamp(22px,4vw,32px);margin:0}a{color:#9bcaff}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.8fr);gap:14px}.panel{background:linear-gradient(145deg,#172943,#101a2b);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}canvas{display:block;width:100%;max-height:72vh;object-fit:contain;background:#03060c;border-radius:12px}.tools{display:grid;gap:11px}.field{padding:10px;border:1px solid #30445f;border-radius:11px;background:#0b1627}.field label{display:block;font-size:12px;color:#d9e6f8;font-weight:750;margin-bottom:6px}input,select,button{max-width:100%;font:inherit}input[type=file],input[type=text],input[type=number],select{width:100%;padding:9px;border:1px solid #405878;border-radius:8px;background:#0b1423;color:#fff}input[type=range]{width:100%;accent-color:var(--pink)}button{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:white;font-weight:800;cursor:pointer}button.secondary{background:#2a3c56;border:1px solid #526783}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.status{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.muted{color:var(--muted);font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{width:calc(100% - 16px)}}
</style></head><body><main>
<header><div><h1>✂️ Dita · Editor manual</h1><div class="muted">Personaliza tus clips antes de exportarlos</div></div><a href="./index.html">← Volver a Dominican Clipper</a></header>
<div class="layout"><section class="panel"><canvas id="stage" width="720" height="1280"></canvas><video id="video" playsinline muted hidden></video><div class="timeline"><div class="field"><label>Inicio (segundos)</label><input id="start" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Final (segundos)</label><input id="end" type="number" min="0" step=".1" value="0"></div></div><div class="actions"><button id="play" class="secondary">▶ Reproducir vista previa</button><button id="pause" class="secondary">Pausar</button><button id="export">Exportar clip editado</button></div><div class="status" id="status">Carga un video para empezar a editar.</div></section>
<aside class="panel tools">
<div class="field"><label>1. Video</label><input id="file" type="file" accept="video/*"></div>
<div class="field"><label>2. Formato</label><select id="format"><option value="9:16">Vertical 9:16 (Reels / Shorts)</option><option value="1:1">Cuadrado 1:1</option><option value="16:9">Horizontal 16:9</option></select></div>
<div class="field"><label>3. Texto / título</label><input id="caption" type="text" placeholder="Escribe tu título aquí"><label>Color del texto</label><input id="textColor" type="color" value="#ffffff"><label>Tamaño del texto</label><input id="textSize" type="range" min="20" max="90" value="48"></div>
<div class="field"><label>4. Logo o imagen superpuesta</label><input id="logo" type="file" accept="image/*"><label>Tamaño del logo</label><input id="logoSize" type="range" min="5" max="45" value="18"></div>
<div class="field"><label>5. Filtros</label><select id="filter"><option value="none">Original</option><option value="contrast(1.2) saturate(1.25)">Intenso</option><option value="grayscale(1)">Blanco y negro</option><option value="sepia(.75)">Cálido</option><option value="brightness(1.15) saturate(.8)">Brillante</option><option value="contrast(1.35)">Alto contraste</option></select></div>
<div class="field"><label>6. Posición del texto</label><select id="textPosition"><option value="bottom">Abajo</option><option value="center">Centro</option><option value="top">Arriba</option></select><label><input id="shadow" type="checkbox" checked> Sombra del texto</label></div>
<div class="muted">Dita aplica los textos, logos y filtros directamente al video exportado. La exportación se realiza en tu navegador.</div>
</aside></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),v=$('video'),c=$('stage'),ctx=c.getContext('2d');let logo=null,raf=0,playing=false,recorder=null,chunks=[];const status=t=>$('status').textContent=t;
function dimensions(){const f=$('format').value.split(':').map(Number),ratio=f[0]/f[1];let w=720,h=Math.round(w/ratio);if(h>1280){h=1280;w=Math.round(h*ratio)}c.width=w;c.height=h}
function draw(){ctx.fillStyle='#03060c';ctx.fillRect(0,0,c.width,c.height);if(v.readyState>=2){const scale=Math.max(c.width/v.videoWidth,c.height/v.videoHeight),w=v.videoWidth*scale,h=v.videoHeight*scale;ctx.save();ctx.filter=$('filter').value;ctx.drawImage(v,(c.width-w)/2,(c.height-h)/2,w,h);ctx.restore()}
const txt=$('caption').value;if(txt){const size=Number($('textSize').value);ctx.save();ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.fillStyle=$('textColor').value;ctx.shadowColor=$('shadow').checked?'#000':'transparent';ctx.shadowBlur=$('shadow').checked?8:0;ctx.shadowOffsetY=3;const y=$('textPosition').value==='top'?size+30:$('textPosition').value==='center'?c.height/2:c.height-size-45;wrapText(txt,c.width-36,y,size);ctx.restore()}
if(logo){const max=c.width*Number($('logoSize').value)/100,scale=Math.min(max/logo.width,max/logo.height),w=logo.width*scale,h=logo.height*scale;ctx.drawImage(logo,c.width-w-22,22,w,h)}}
function wrapText(t,max,y,size){const words=t.split(/\s+/);let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,c.width/2,y+i*(size*1.15)))}
function tick(){draw();if(playing){if(v.currentTime>=Number($('end').value)){v.pause();playing=false;return}raf=requestAnimationFrame(tick)}}
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;v.src=URL.createObjectURL(f);v.onloadedmetadata=()=>{$('start').value=0;$('end').value=v.duration;dimensions();draw();status('Video cargado. Ajusta textos, logo y filtros.')}})
$('logo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{logo=im;draw()};im.src=URL.createObjectURL(f)})
['caption','textColor','textSize','logoSize','filter','textPosition','shadow','format'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='format')dimensions();draw()}));
$('play').onclick=async()=>{if(!v.src){status('Primero carga un video.');return}const a=Math.max(0,Number($('start').value)||0),b=Math.min(v.duration,Number($('end').value)||v.duration);if(b<=a){status('El final debe ser posterior al inicio.');return}if(v.currentTime<a||v.currentTime>=b)v.currentTime=a;await v.play();playing=true;tick()};
$('pause').onclick=()=>{v.pause();playing=false;cancelAnimationFrame(raf);draw()};
$('export').onclick=async()=>{if(!v.src){status('Primero carga un video.');return}if(!window.MediaRecorder||!c.captureStream){status('Tu navegador no admite exportación WebM. Usa Chrome o Edge actualizado.');return}const a=Math.max(0,Number($('start').value)||0),b=Math.min(v.duration,Number($('end').value)||v.duration);if(b<=a){status('Revisa el inicio y el final.');return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status('No hay formato WebM compatible.');return}const btn=$('export');btn.disabled=true;chunks=[];playing=false;try{v.pause();v.currentTime=a;await new Promise(resolve=>v.addEventListener('seeked',resolve,{once:true}));draw();const stream=c.captureStream(30);const source=v.captureStream?.();if(source)source.getAudioTracks().forEach(t=>stream.addTrack(t));recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:mime});let saved=false;try{const db=await new Promise((resolve,reject)=>{const req=indexedDB.open('dominican-clipper-edited-clips',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('clips'))req.result.createObjectStore('clips',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir la biblioteca'))});const id=(crypto.randomUUID?crypto.randomUUID():'dita-'+Date.now()+'-'+Math.random().toString(16).slice(2));await new Promise((resolve,reject)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put({id,name:'Clip editado por ti.webm',blob,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('No se pudo guardar el clip'))});db.close();saved=true}catch(saveError){console.warn('No se pudo guardar el clip en la galería:',saveError)}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='dita-clip-editado.webm';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);btn.disabled=false;status(saved?'¡Clip editado guardado en la galería y descargado! Vuelve a Dominican Clipper para verlo.':'El clip se descargó, pero no se pudo guardar en la galería de clips.');};recorder.start(200);await v.play();const loop=()=>{draw();if(v.currentTime>=b||v.ended){v.pause();if(recorder.state!=='inactive')recorder.stop();return}requestAnimationFrame(loop)};loop();status('Exportando clip editado… no cierres esta página.')}catch(err){btn.disabled=false;status('No se pudo exportar: '+err.message)}};
draw();
})();
</script></body></html>
